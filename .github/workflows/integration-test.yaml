name: Integration Tests

on:
  pull_request:

jobs:
  integration-test:
    permissions:
      actions: read
      contents: read
      # The charm-ci build job declares packages: write (for pushing rock
      # images to the registry). Reusable workflows can't request permissions
      # conditionally, so the caller must grant it even when no images are
      # pushed — without it every run fails at startup with "the nested job
      # 'build' is requesting 'packages: write', but is only allowed
      # 'packages: none'".
      packages: write
    uses: canonical/charm-ci/.github/workflows/integration-test.yml@0eef5b8cbef3ee74907850f790cab64bcf0499e5  # v1.0.0
    with:
      working-directory: .
      # s390x builds routinely take 45-47 minutes (the other architectures take
      # 6-14), so charm-ci's default 60-minute limit times them out ("exceeded
      # the maximum execution time") on a slow day.
      # The test jobs wait build-timeout-minutes + 10 for the artifacts inside
      # their own 120-minute limit, so going much higher needs
      # test-timeout-minutes raised as well.
      build-timeout-minutes: 90
