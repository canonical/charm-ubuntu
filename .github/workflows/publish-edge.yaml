name: Publish

on:
  push:
    branches:
      - master

permissions: {}

jobs:
  publish:
    uses: canonical/charm-ci/.github/workflows/publish-artifacts.yml@f0746f4dab15ea08354d38024b188b38576b944a  # v0.0.1-alpha.10
    permissions:
      actions: read
      # contents: write is needed for the reusable workflow's final
      # "Create GitHub Release" step (canonical/charm-ci's
      # create-publish-release.sh).
      contents: write
    with:
      channel: latest/edge
      integration-workflow-name: integration-test.yaml
      # ubuntu is a multi-base charm, so a single publish creates several
      # CharmHub revisions, and previously one GitHub Release per revision.
      # Publish a single combined release per run listing them all, and skip
      # the per-revision git tags: CharmHub revisions are already tracked
      # there and in the combined release body.
      create-tags: false
      create-release: true
    # CHARMCRAFT_AUTH must be a repository secret. GitHub Actions forbids
    # `environment:` on jobs that call a reusable workflow, so scoping the
    # CharmHub credential to a GitHub environment isn't possible until
    # canonical/charm-ci's publish-artifacts.yml accepts an environment input.
    secrets:
      CHARMHUB_TOKEN: ${{ secrets.CHARMCRAFT_AUTH }}
