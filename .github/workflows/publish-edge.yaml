name: Publish

on:
  push:
    branches:
      - master

permissions: {}

jobs:
  publish:
    uses: canonical/charm-ci/.github/workflows/publish-artifacts.yml@f0746f4dab15ea08354d38024b188b38576b944a  # v0.0.1-alpha.10
    permissions:
      actions: read
      # contents: write is needed for the reusable workflow's final
      # "Create GitHub Release" step (canonical/charm-ci's
      # create-publish-release.sh).
      contents: write
    with:
      channel: latest/edge
      integration-workflow-name: integration-test.yaml
      # Scopes the reusable workflow's `publish` job to the charmhub-edge
      # environment, so publishing is gated by that environment's protection
      # rules (and shows up in the environment's deployment history).
      # Note: this requires that there is a `CHARMHUB_TOKEN` in the
      # `charmhub-edge` environment, that contains an exported token from
      # `charmcraft` with the appropriate privileges.
      environment: charmhub-edge
    secrets:
      CHARMHUB_TOKEN: ${{ secrets.CHARMCRAFT_AUTH }}
