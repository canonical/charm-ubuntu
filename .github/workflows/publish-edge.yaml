name: Publish

on:
  push:
    branches:
      - master

permissions: {}

jobs:
  publish:
    uses: canonical/charm-ci/.github/workflows/publish-artifacts.yml@f0746f4dab15ea08354d38024b188b38576b944a  # v0.0.1-alpha.10
    permissions:
      actions: read
      # contents: write is needed for the reusable workflow's tagging and
      # "Create GitHub Release" steps (canonical/charm-ci's
      # create-publish-release.sh).
      contents: write
    with:
      channel: latest/edge
      integration-workflow-name: integration-test.yaml
      # ubuntu is a multi-base charm, so a single publish creates several
      # CharmHub revisions. Keep a per-revision git tag for traceability, but
      # collapse the GitHub Releases into one combined release per publish run
      # instead of one per revision (which produced five "ubuntu revNN"
      # releases at a time).
      create-tags: true
      create-release: true
      # Scopes the reusable workflow's publish job to this environment, giving
      # a deployment record for every CharmHub publish. The token itself is
      # still the repository secret below: GitHub Actions forbids
      # `environment:` on a job that calls a reusable workflow, so the caller
      # can only read repo-level secrets.
      environment: charmhub-edge
    secrets:
      CHARMHUB_TOKEN: ${{ secrets.CHARMCRAFT_AUTH }}
