name: Dependency vulnerability scan

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: Export locked dependencies (excluding this project)
        run: uv export --no-default-groups --frozen --no-emit-project --format requirements-txt -o requirements.txt

      - name: Run pip-audit
        run: uv run --frozen --only-group security pip-audit --disable-pip -r requirements.txt -f json
