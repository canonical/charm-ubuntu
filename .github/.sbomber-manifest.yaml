clients:
  sbom:
    service_url: https://sbom-request.canonical.com
    department: charm_engineering
    email: tony.meyer@canonical.com
    team: charm_tech
  secscan: {}

# The bases below must match the platforms in charmcraft.yaml: every base we
# build and publish needs to be scanned.
artifacts:
  - name: ubuntu
    type: charm
    channel: 'latest/stable'
    base: ubuntu@22.04
    ssdlc_params:
      name: ubuntu
      version: ''  # auto-detect from the downloaded revision
      channel: 'stable'

  - name: ubuntu
    type: charm
    channel: 'latest/stable'
    base: ubuntu@24.04
    ssdlc_params:
      name: ubuntu
      version: ''
      channel: 'stable'

  - name: ubuntu
    type: charm
    channel: 'latest/stable'
    base: ubuntu@26.04
    ssdlc_params:
      name: ubuntu
      version: ''
      channel: 'stable'
