name: dev
base: ubuntu@26.04
sdks:
  - name: uv
    channel: latest/stable
  - name: pi
    channel: latest/stable
  # The project- prefix tells Workshop to load this SDK from .workshop/tools/
  # rather than the store, and the directory and the name in its sdk.yaml must
  # both match what follows the prefix. It installs make, which the actions
  # below run, and the charm's development dependencies.
  - name: project-tools

# The checks CONTRIBUTING.md asks for, through the Makefile targets.
#
# There is deliberately no integration action. Spread runs the tests in an LXD
# VM, and the workshop has no KVM. Packing the charm fails too, because snapd
# won't start in Charmcraft's nested LXD build container. Run them on the host
# instead.
actions:
  format: make format
  lint: make lint
  pi: pi "$@"
  unit: make unit ARGS="$*"
